{% extends "base.html" %}
{% block title %}Panel{% endblock %}
{% block content %}
<div class="card">
  <h1>Notlarım</h1>
  <form method="post" class="row">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input name="content" placeholder="Yeni not..." maxlength="500" required>
    <button>Ekle</button>
  </form>
  <ul class="notes">
    {% for n in notes %}
      <li>
        <div>
          <div>{{ n.content }}</div>
          <small class="muted">{{ n.created_at }}</small>
        </div>
        <form method="post" action="{{ url_for('delete_note', note_id=n.id) }}">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <button class="danger">Sil</button>
        </form>
      </li>
    {% else %}
      <li class="muted">Henüz not yok.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
