<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demo{% endblock %} · Flask + SQLite</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Flask + SQLite Demo</a>
    <nav>
      {% if g.user %}
        <span>{{ g.user.username }}</span>
        {% if g.user.is_admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <button class="link">Çıkış</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Giriş</a>
        <a href="{{ url_for('register') }}">Kayıt</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
