{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<div class="card">
  <h1>Kullanıcılar</h1>
  <table>
    <tr><th>ID</th><th>Kullanıcı</th><th>Rol</th><th>Not</th><th>Kayıt</th></tr>
    {% for u in users %}
      <tr>
        <td>{{ u.id }}</td><td>{{ u.username }}</td>
        <td>{{ 'admin' if u.is_admin else 'user' }}</td>
        <td>{{ u.note_count }}</td><td>{{ u.created_at }}</td>
      </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
