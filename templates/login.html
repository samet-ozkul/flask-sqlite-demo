{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Giriş Yap</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Kullanıcı adı <input name="username" required autofocus></label>
    <label>Şifre <input name="password" type="password" required></label>
    <button>Giriş</button>
  </form>
  <p class="muted">Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt ol</a></p>
</div>
{% endblock %}
